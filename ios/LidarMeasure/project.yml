# XcodeGen spec — a fallback for regenerating LidarMeasure.xcodeproj.
# The committed project (Xcode 16+ format) is the primary entry point; use this only if you
# prefer XcodeGen or need an older project format:  brew install xcodegen && xcodegen generate
name: LidarMeasure
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MeasureCore:
    path: Packages/MeasureCore
targets:
  LidarMeasure:
    type: application
    platform: iOS
    sources:
      - path: LidarMeasure
    dependencies:
      - package: MeasureCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lidarmeasure
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
schemes:
  LidarMeasure:
    build:
      targets:
        LidarMeasure: all
    test:
      targets:
        - package: MeasureCore/MeasureCoreTests
